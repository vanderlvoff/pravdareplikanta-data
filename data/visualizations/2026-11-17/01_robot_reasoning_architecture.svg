<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title"><title id="title">От наблюдения к действию: схема PEAR</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker></defs><rect width="960" height="680" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#171717"><text x="42" y="54" font-size="30" font-weight="700">ОТ НАБЛЮДЕНИЯ К ДЕЙСТВИЮ</text><text x="42" y="87" font-size="18" font-weight="400">PEAR: модель выбирает позу, отдельный контроллер исполняет движение</text><rect x="42" y="127" width="418" height="147" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="67" y="169" font-size="23" font-weight="700">01 · НАБЛЮДЕНИЕ</text><text x="67" y="210" font-size="20" font-weight="400">Изображение, состояние руки</text><text x="67" y="242" font-size="20" font-weight="400">и текстовая инструкция</text><rect x="500" y="127" width="418" height="147" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="525" y="169" font-size="23" font-weight="700">02 · МОДЕЛЬ</text><text x="525" y="210" font-size="20" font-weight="400">Выбирает целевую позу</text><text x="525" y="242" font-size="20" font-weight="400">рабочего инструмента</text><path d="M461 200H493" stroke="#222" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="500" y="349" width="418" height="147" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="525" y="391" font-size="21" font-weight="700">03 · ОБРАТНАЯ КИНЕМАТИКА</text><text x="525" y="432" font-size="20" font-weight="400">Вычисляет положения</text><text x="525" y="464" font-size="20" font-weight="400">суставов робота</text><rect x="42" y="349" width="418" height="147" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="67" y="391" font-size="23" font-weight="700">04 · КОНТРОЛЛЕР</text><text x="67" y="432" font-size="20" font-weight="400">Исполняет рассчитанное</text><text x="67" y="464" font-size="20" font-weight="400">движение</text><path d="M709 275V342" stroke="#222" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M499 422H466" stroke="#222" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="42" y="545" width="876" height="77" rx="12" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="67" y="577" font-size="18" font-weight="700">Обучение модели — в симуляции; исполнение — на физическом роботе.</text><text x="67" y="604" font-size="17" font-weight="400">Схема упрощена и не воспроизводит экспериментальную установку.</text><text x="42" y="658" font-size="15" font-weight="400">Источник: pear-paper · По данным авторов</text></g></svg>