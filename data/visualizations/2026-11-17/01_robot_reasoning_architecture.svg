<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333"/></marker></defs><rect width="960" height="450" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#161616"><text x="480" y="42" font-size="26" font-weight="700" text-anchor="middle">Как модель управляет роботизированной рукой</text><rect x="28" y="100" width="205" height="124" rx="12" fill="white" stroke="#222" stroke-width="2"/><text x="130" y="145" font-size="21" font-weight="700" text-anchor="middle">Наблюдение</text><text x="130" y="177" font-size="16" font-weight="400" text-anchor="middle">Изображения, состояние</text><text x="130" y="199" font-size="16" font-weight="400" text-anchor="middle">и инструкция</text><rect x="270" y="100" width="205" height="124" rx="12" fill="white" stroke="#222" stroke-width="2"/><text x="372" y="145" font-size="21" font-weight="700" text-anchor="middle">Модель</text><text x="372" y="177" font-size="17" font-weight="400" text-anchor="middle">Выбор целевой</text><text x="372" y="199" font-size="17" font-weight="400" text-anchor="middle">позы инструмента</text><rect x="512" y="100" width="205" height="124" rx="12" fill="white" stroke="#222" stroke-width="2"/><text x="614" y="145" font-size="21" font-weight="700" text-anchor="middle">Кинематика</text><text x="614" y="177" font-size="17" font-weight="400" text-anchor="middle">Расчёт</text><text x="614" y="199" font-size="17" font-weight="400" text-anchor="middle">положений суставов</text><rect x="754" y="100" width="178" height="124" rx="12" fill="white" stroke="#222" stroke-width="2"/><text x="843" y="145" font-size="21" font-weight="700" text-anchor="middle">Контроллер</text><text x="843" y="177" font-size="17" font-weight="400" text-anchor="middle">Выполнение</text><text x="843" y="199" font-size="17" font-weight="400" text-anchor="middle">движения</text><path d="M234 163 L267 163" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><path d="M476 163 L509 163" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><path d="M718 163 L751 163" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="125" y="292" width="710" height="100" rx="12" fill="white" stroke="#222" stroke-width="2"/><text x="480" y="328" font-size="21" font-weight="700" text-anchor="middle">Обучение с подкреплением — в симуляции</text><text x="480" y="359" font-size="18" font-weight="400" text-anchor="middle">Физический робот использует отдельный контроллер</text><text x="26" y="432" font-size="14" font-weight="400" text-anchor="start">Источник: pear-paper · Концептуальная схема, не чертёж установки</text></g></svg>