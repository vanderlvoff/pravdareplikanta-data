<svg xmlns="http://www.w3.org/2000/svg" width="960" height="695" viewBox="0 0 960 695" role="img" aria-labelledby="title"><title id="title">Результаты модели PEAR: общая шкала успешности</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker></defs><rect width="960" height="695" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#171717"><text x="42" y="53" font-size="30" font-weight="700">PEAR: РЕЗУЛЬТАТЫ ИСПЫТАНИЙ</text><text x="42" y="87" font-size="18" font-weight="400">Доля успешных попыток по данным авторов; шкала каждого столбца — 0–100%</text><rect x="42" y="113" width="876" height="230" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="72" y="155" font-size="22" font-weight="700">LIBERO · испытания в симуляции</text><text x="72" y="194" font-size="20" font-weight="600">До обучения</text><rect x="72" y="211" width="626" height="26" rx="3" fill="#e1e1e1"/><rect x="72" y="211" width="10.02" height="26" rx="3" fill="#222"/><text x="719" y="232" font-size="21" font-weight="700">1,6%</text><text x="72" y="270" font-size="20" font-weight="600">После обучения</text><rect x="72" y="287" width="626" height="26" rx="3" fill="#e1e1e1"/><rect x="72" y="287" width="465.74" height="26" rx="3" fill="#222"/><text x="719" y="308" font-size="21" font-weight="700">74,4%</text><rect x="42" y="369" width="876" height="232" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="72" y="411" font-size="22" font-weight="700">Физический робот · по 30 попыток</text><text x="72" y="446" font-size="20" font-weight="600">Исходная модель</text><rect x="72" y="463" width="626" height="26" rx="3" fill="#e1e1e1"/><text x="719" y="484" font-size="21" font-weight="700">0% (0/30)</text><text x="72" y="522" font-size="20" font-weight="600">Обученная модель</text><rect x="72" y="539" width="626" height="26" rx="3" fill="#e1e1e1"/><rect x="72" y="539" width="375.60" height="26" rx="3" fill="#222"/><text x="719" y="560" font-size="21" font-weight="700">60% (18/30)</text><text x="72" y="639" font-size="17" font-weight="400">Полная длина каждой серой полосы = 100% успешных попыток.</text><text x="42" y="674" font-size="15" font-weight="400">Источник: pear-paper · Независимая репликация не установлена</text></g></svg>