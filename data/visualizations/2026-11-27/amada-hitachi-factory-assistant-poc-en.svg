<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" width="360" height="550" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">From advice to machine control</title>
  <desc id="desc">Tested in a proof of concept / Planned work / Suggest a new schedule / when a deadline changes / Suggest checks / for a machine fault / Try the assistant / at selected customer plants / Link recommendations / to control of machines / and robots</desc>
  <rect x="0" y="0" width="360" height="550" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">Amada and Hitachi · factory assistant</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">From advice to</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">machine control</text>
  <text x="25" y="148" fill="#116768" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" id="g6">Tested in a proof of concept</text>
  <line x1="25" y1="162" x2="334" y2="162" stroke="#116768" stroke-width="1.8" data-qa-group="rule-0" id="g7"/>
  <circle cx="32" cy="192" r="6" fill="#116768" stroke="#116768" data-qa-group="point-0-0" id="g8"/>
  <text x="48" y="197" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g9">Suggest a new schedule</text>
  <text x="48" y="216" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g10">when a deadline changes</text>
  <circle cx="32" cy="243" r="6" fill="#116768" stroke="#116768" data-qa-group="point-0-1" id="g11"/>
  <text x="48" y="248" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g12">Suggest checks</text>
  <text x="48" y="267" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g13">for a machine fault</text>
  <text x="25" y="320" fill="#9a4627" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" id="g14">Planned work</text>
  <line x1="25" y1="334" x2="334" y2="334" stroke="#9a4627" stroke-width="1.8" data-qa-group="rule-1" id="g15"/>
  <circle cx="32" cy="364" r="6" fill="#fffefa" stroke="#9a4627" data-qa-group="point-1-0" id="g16"/>
  <text x="48" y="369" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g17">Try the assistant</text>
  <text x="48" y="388" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g18">at selected customer plants</text>
  <circle cx="32" cy="432" r="6" fill="#fffefa" stroke="#9a4627" data-qa-group="point-1-1" id="g19"/>
  <text x="48" y="437" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g20">Link recommendations</text>
  <text x="48" y="456" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g21">to control of machines</text>
  <text x="48" y="475" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g22">and robots</text>
  <text x="25" y="509" fill="#40575b" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g23">Stages reported by the companies.</text>
  <text x="25" y="533" fill="#40575b" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g24">Source: Amada and Hitachi</text>
</svg>
