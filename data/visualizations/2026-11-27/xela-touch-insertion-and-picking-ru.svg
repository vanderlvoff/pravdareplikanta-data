  <title id="title">Где роборуке помогает осязание</title>
  <desc id="desc">Штекер упирается в край / Сигнал: растёт сопротивление. / Действие: поправить положение. / Винт скользит в захвате / Сигнал: винт сдвигается. / Действие: изменить силу захвата. / Показан принцип работы.</desc>
