<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" width="360" height="550" xml:lang="ja" role="img" aria-labelledby="title desc">
  <title id="title">工場への提案から 機械の制御へ</title>
  <desc id="desc">検証した内容 / 今後の計画 / 納期が変わったときに / 生産計画を調整する案 / 機械の不具合で / 何を調べるかの提案 / 選んだ顧客の工場で / 支援ソフトを試す / 提案を機械や / ロボットの制御に / つなげる仕組みを開発</desc>
  <rect x="0" y="0" width="360" height="550" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">アマダ・日立 · 工場の支援ソフト</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">工場への提案から</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">機械の制御へ</text>
  <text x="25" y="148" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="start" id="g6">検証した内容</text>
  <line x1="25" y1="162" x2="334" y2="162" stroke="#116768" stroke-width="1.8" data-qa-group="rule-0" id="g7"/>
  <circle cx="32" cy="192" r="6" fill="#116768" stroke="#116768" data-qa-group="point-0-0" id="g8"/>
  <text x="48" y="197" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g9">納期が変わったときに</text>
  <text x="48" y="216" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g10">生産計画を調整する案</text>
  <circle cx="32" cy="243" r="6" fill="#116768" stroke="#116768" data-qa-group="point-0-1" id="g11"/>
  <text x="48" y="248" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g12">機械の不具合で</text>
  <text x="48" y="267" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g13">何を調べるかの提案</text>
  <text x="25" y="320" fill="#9a4627" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" text-anchor="start" id="g14">今後の計画</text>
  <line x1="25" y1="334" x2="334" y2="334" stroke="#9a4627" stroke-width="1.8" data-qa-group="rule-1" id="g15"/>
  <circle cx="32" cy="364" r="6" fill="#fffefa" stroke="#9a4627" data-qa-group="point-1-0" id="g16"/>
  <text x="48" y="369" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g17">選んだ顧客の工場で</text>
  <text x="48" y="388" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g18">支援ソフトを試す</text>
  <circle cx="32" cy="432" r="6" fill="#fffefa" stroke="#9a4627" data-qa-group="point-1-1" id="g19"/>
