  <text x="25" y="509" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g23">両社が発表した進み具合。</text>
  <text x="25" y="533" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g24">出典：アマダ・日立</text>
