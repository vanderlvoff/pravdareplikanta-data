<svg xmlns="http://www.w3.org/2000/svg" lang="en" role="img" aria-label="How Hido II maps indoors" viewBox="0 0 380 392" width="100%" style="display:block;background:white" font-family="DejaVu Sans, sans-serif" fill="#192722"><title>How Hido II maps indoors</title><text id="n1" x="16" y="32" font-size="23" font-weight="bold">How Hido II maps indoors</text><text id="n2" x="16" y="58" font-size="16">A technician supervises the survey</text><g><rect id="n3" x="10" y="86" width="360" height="92" fill="#f4f3ed"/><text id="n4" x="23" y="112" font-size="19" font-weight="bold">Movement</text><text id="n5" x="23" y="139" font-size="18">The rover follows a planned route</text><text id="n6" x="23" y="162" font-size="18">and steers around obstacles.</text></g><g><rect id="n7" x="10" y="188" width="360" height="92" fill="#f4f3ed"/><text id="n8" x="23" y="214" font-size="19" font-weight="bold">Geometry</text><text id="n9" x="23" y="241" font-size="18">A stereo camera and lidar capture</text><text id="n10" x="23" y="264" font-size="18">the shape of the surroundings.</text></g><g><rect id="n11" x="10" y="290" width="360" height="92" fill="#f4f3ed"/><text id="n12" x="23" y="316" font-size="19" font-weight="bold">Magnetic field</text><text id="n13" x="23" y="343" font-size="18">A robotic arm positions the sensor</text><text id="n14" x="23" y="366" font-size="18">for magnetic field measurements.</text></g></svg>
