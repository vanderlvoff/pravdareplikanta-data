<svg xmlns="http://www.w3.org/2000/svg" lang="en" role="img" aria-label="Robots in chip factories" viewBox="0 0 380 336" width="100%" style="display:block;background:white" font-family="DejaVu Sans, sans-serif" fill="#192722"><title>Robots in chip factories</title><text id="n1" x="16" y="32" font-size="23" font-weight="bold">Robots in chip factories</text><text id="n2" x="16" y="58" font-size="16">GlobalFoundries and Boston Dynamics</text><g><rect id="n3" x="10" y="86" width="360" height="115" fill="#f4f3ed"/><text id="n4" x="23" y="112" font-size="19" font-weight="bold">Spot · in service</text><text id="n5" x="23" y="139" font-size="18">Since April, two robots in Singapore</text><text id="n6" x="23" y="162" font-size="18">have carried out more than 90,000</text><text id="n7" x="23" y="185" font-size="18">equipment inspections.</text></g><g><rect id="n8" x="10" y="211" width="360" height="115" fill="#f4f3ed"/><text id="n9" x="23" y="237" font-size="19" font-weight="bold">Atlas · planned trials</text><text id="n10" x="23" y="264" font-size="18">Testing is scheduled to begin in</text><text id="n11" x="23" y="287" font-size="18">early 2027. The companies are still</text><text id="n12" x="23" y="310" font-size="18">selecting tasks for the humanoid.</text></g></svg>
