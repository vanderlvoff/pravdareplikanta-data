<svg xmlns="http://www.w3.org/2000/svg" lang="ja" role="img" aria-label="Hido IIが建物を測るしくみ" viewBox="0 0 380 392" width="100%" style="display:block;background:white" font-family="Noto Sans CJK JP, sans-serif" fill="#192722"><title>Hido IIが建物を測るしくみ</title><text id="n1" x="16" y="32" font-size="23" font-weight="bold">Hido IIが建物を測るしくみ</text><text id="n2" x="16" y="58" font-size="16">技術者が見守る中での地図づくり</text><g><rect id="n3" x="10" y="86" width="360" height="92" fill="#f4f3ed"/><text id="n4" x="23" y="112" font-size="19" font-weight="bold">移動</text><text id="n5" x="23" y="139" font-size="18">決めた経路を進み、障害物が</text><text id="n6" x="23" y="162" font-size="18">あれば道順を変える。</text></g><g><rect id="n7" x="10" y="188" width="360" height="92" fill="#f4f3ed"/><text id="n8" x="23" y="214" font-size="19" font-weight="bold">周囲の形</text><text id="n9" x="23" y="241" font-size="18">二つの視点で撮るカメラとレーザー</text><text id="n10" x="23" y="264" font-size="18">センサーで周囲の形を捉える。</text></g><g><rect id="n11" x="10" y="290" width="360" height="92" fill="#f4f3ed"/><text id="n12" x="23" y="316" font-size="19" font-weight="bold">磁場の測定</text><text id="n13" x="23" y="343" font-size="18">ロボットアームでセンサーの位置を</text><text id="n14" x="23" y="366" font-size="18">合わせ、磁場を測る。</text></g></svg>
