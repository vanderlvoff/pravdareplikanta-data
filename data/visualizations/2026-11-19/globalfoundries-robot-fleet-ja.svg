<svg xmlns="http://www.w3.org/2000/svg" lang="ja" role="img" aria-label="半導体工場で働くロボット" viewBox="0 0 380 335" width="100%" style="display:block;background:white" font-family="Noto Sans CJK JP, sans-serif" fill="#192722"><title>半導体工場で働くロボット</title><text id="n1" x="16" y="32" font-size="23" font-weight="bold">半導体工場で働くロボット</text><text id="n2" x="16" y="58" font-size="16">グローバルファウンドリーズと</text><text id="n3" x="16" y="80" font-size="16">ボストン・ダイナミクスの発表</text><g><rect id="n4" x="10" y="108" width="360" height="92" fill="#f4f3ed"/><text id="n5" x="23" y="134" font-size="19" font-weight="bold">Spot｜稼働中</text><text id="n6" x="23" y="161" font-size="18">シンガポールの工場では、4月から</text><text id="n7" x="23" y="184" font-size="18">2台で9万回を超える点検を行った。</text></g><g><rect id="n8" x="10" y="210" width="360" height="115" fill="#f4f3ed"/><text id="n9" x="23" y="236" font-size="19" font-weight="bold">Atlas｜試験を計画</text><text id="n10" x="23" y="263" font-size="18">試験は2027年初めに始める予定。</text><text id="n11" x="23" y="286" font-size="18">人型ロボットにどの作業を任せるか、</text><text id="n12" x="23" y="309" font-size="18">両社が検討している。</text></g></svg>
