<svg xmlns="http://www.w3.org/2000/svg" lang="ru" role="img" aria-label="Роботы на фабрике чипов" viewBox="0 0 380 336" width="100%" style="display:block;background:white" font-family="DejaVu Sans, sans-serif" fill="#192722"><title>Роботы на фабрике чипов</title><text id="n1" x="16" y="32" font-size="21" font-weight="bold">Роботы на фабрике чипов</text><text id="n2" x="16" y="58" font-size="16">GlobalFoundries и Boston Dynamics</text><g><rect id="n3" x="10" y="86" width="360" height="115" fill="#f4f3ed"/><text id="n4" x="23" y="112" font-size="19" font-weight="bold">Spot · в эксплуатации</text><text id="n5" x="23" y="139" font-size="18">Два робота в Сингапуре</text><text id="n6" x="23" y="162" font-size="18">с апреля провели более</text><text id="n7" x="23" y="185" font-size="18">90 000 проверок оборудования.</text></g><g><rect id="n8" x="10" y="211" width="360" height="115" fill="#f4f3ed"/><text id="n9" x="23" y="237" font-size="19" font-weight="bold">Atlas · в планах</text><text id="n10" x="23" y="264" font-size="18">Начало испытаний намечено</text><text id="n11" x="23" y="287" font-size="18">на начало 2027 года. Конкретную</text><text id="n12" x="23" y="310" font-size="18">задачу компании ещё выбирают.</text></g></svg>
