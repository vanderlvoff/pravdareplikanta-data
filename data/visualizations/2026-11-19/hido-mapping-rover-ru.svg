<svg xmlns="http://www.w3.org/2000/svg" lang="ru" role="img" aria-label="Hido II составляет карту" viewBox="0 0 380 415" width="100%" style="display:block;background:white" font-family="DejaVu Sans, sans-serif" fill="#192722"><title>Hido II составляет карту</title><text id="n1" x="16" y="32" font-size="23" font-weight="bold">Hido II составляет карту</text><text id="n2" x="16" y="58" font-size="16">Техник наблюдает за съёмкой</text><g><rect id="n3" x="10" y="86" width="360" height="92" fill="#f4f3ed"/><text id="n4" x="23" y="112" font-size="19" font-weight="bold">Движение</text><text id="n5" x="23" y="139" font-size="18">Ровер следует по маршруту</text><text id="n6" x="23" y="162" font-size="18">и объезжает препятствия.</text></g><g><rect id="n7" x="10" y="188" width="360" height="92" fill="#f4f3ed"/><text id="n8" x="23" y="214" font-size="19" font-weight="bold">Обзор</text><text id="n9" x="23" y="241" font-size="18">Стереокамера и лидар собирают</text><text id="n10" x="23" y="264" font-size="18">данные о форме помещения.</text></g><g><rect id="n11" x="10" y="290" width="360" height="115" fill="#f4f3ed"/><text id="n12" x="23" y="316" font-size="19" font-weight="bold">Измерение</text><text id="n13" x="23" y="343" font-size="18">Рука ставит датчик в нужное</text><text id="n14" x="23" y="366" font-size="18">положение для измерения</text><text id="n15" x="23" y="389" font-size="18">магнитного поля.</text></g></svg>
