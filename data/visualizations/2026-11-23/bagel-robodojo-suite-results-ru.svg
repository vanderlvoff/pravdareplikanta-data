  <rect id="panel2" x="20" y="327" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k2" x="32" y="353" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel2">03</text>
  <text id="label2" x="64" y="353" font-size="17" fill="#18283A" font-weight="700" data-panel="panel2">Выполнить первые 16</text>
  <text id="row2-0" x="32" y="381" font-size="16" fill="#18283A" font-weight="400" data-panel="panel2">Затем заново получить наблюдения</text>
  <text id="note0" x="20" y="440" font-size="15" fill="#425468" font-weight="400">Следующий цикл использует свежие</text>
  <text id="note1" x="20" y="462" font-size="15" fill="#425468" font-weight="400">данные.</text>
