  <title id="title">Как модель ведёт две руки</title>
  <desc id="desc">Bagel-Robotics-1 · испытание в симуляции / Получить наблюдения — Три камеры, состояние робота — и текст задания / Рассчитать 32 действия — Модель строит план для обеих рук / Выполнить первые 16 — Затем заново получить наблюдения / Следующий цикл использует свежие данные.</desc>
  <rect id="paper" x="0" y="0" width="360" height="484" fill="#F7F4ED" data-role="background"/>
  <rect id="rule" x="20" y="16" width="52" height="4" fill="#0D615D"/>
  <text id="head0" x="20" y="47" font-size="22" fill="#18283A" font-weight="700">Как модель ведёт две руки</text>
  <text id="subtitle" x="20" y="77" font-size="15" fill="#425468" font-weight="400">Bagel-Robotics-1 · испытание в симуляции</text>
  <rect id="panel0" x="20" y="106" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k0" x="32" y="132" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel0">01</text>
  <text id="label0" x="64" y="132" font-size="17" fill="#18283A" font-weight="700" data-panel="panel0">Получить наблюдения</text>
  <text id="row0-0" x="32" y="160" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Три камеры, состояние робота</text>
  <text id="row0-1" x="32" y="183" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">и текст задания</text>
  <path id="arrow0" d="M179 208 H181 V216 H185 L180 223 L175 216 H179 Z" fill="#0D615D"/>
  <rect id="panel1" x="20" y="228" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
