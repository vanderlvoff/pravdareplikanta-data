  <text id="label1" x="64" y="254" font-size="17" fill="#18283A" font-weight="700" data-panel="panel1">Рассчитать 32 действия</text>
  <text id="row1-0" x="32" y="282" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">Модель строит план для обеих рук</text>
