  <title id="title">Два маршрута лекарств</title>
  <desc id="desc">ИСПЫТАНИЯ В СИНСИРО / У места взлёта — Загрузка / По дороге — Загрузка / Аптека — Везёт коробку — на машине / Площадка — Дрон берёт груз / Площадка — Дрон летит — пустым / Аптека — Крепит коробку / Дом для пожилых — Приём коробки / Линии показывают этапы маршрута.</desc>
