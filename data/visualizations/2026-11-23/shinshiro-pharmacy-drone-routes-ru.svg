<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" lang="ru" role="img" aria-labelledby="title desc" font-family="Noto Sans, Arial, sans-serif" height="420" viewBox="0 0 360 420">
  <title id="title">Два маршрута дрона</title>
  <desc id="desc">Два испытательных маршрута · Синсиро / Загрузка у места взлёта — Аптека привозит коробку машиной — Дрон летит до дома престарелых / Загрузка по дороге — Дрон вылетает пустым и садится — у аптеки, где ему крепят коробку — Затем летит в дом престарелых / На обоих маршрутах коробку забирают люди.</desc>
  <rect id="paper" x="0" y="0" width="360" height="420" fill="#F7F4ED" data-role="background"/>
  <rect id="rule" x="20" y="16" width="52" height="4" fill="#0D615D"/>
  <text id="head0" x="20" y="47" font-size="22" fill="#18283A" font-weight="700">Два маршрута дрона</text>
  <text id="subtitle" x="20" y="77" font-size="15" fill="#425468" font-weight="400">Два испытательных маршрута · Синсиро</text>
  <rect id="panel0" x="20" y="106" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k0" x="32" y="132" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel0">01</text>
  <text id="label0" x="64" y="132" font-size="17" fill="#18283A" font-weight="700" data-panel="panel0">Загрузка у места взлёта</text>
  <text id="row0-0" x="32" y="160" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Аптека привозит коробку машиной</text>
  <text id="row0-1" x="32" y="183" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Дрон летит до дома престарелых</text>
  <rect id="panel1" x="20" y="217" width="320" height="121" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k1" x="32" y="243" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel1">02</text>
  <text id="label1" x="64" y="243" font-size="17" fill="#18283A" font-weight="700" data-panel="panel1">Загрузка по дороге</text>
  <text id="row1-0" x="32" y="271" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">Дрон вылетает пустым и садится</text>
  <text id="row1-1" x="32" y="294" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">у аптеки, где ему крепят коробку</text>
  <text id="row1-2" x="32" y="317" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">Затем летит в дом престарелых</text>
  <text id="note0" x="20" y="376" font-size="15" fill="#425468" font-weight="400">На обоих маршрутах коробку забирают</text>
  <text id="note1" x="20" y="398" font-size="15" fill="#425468" font-weight="400">люди.</text>
</svg>
