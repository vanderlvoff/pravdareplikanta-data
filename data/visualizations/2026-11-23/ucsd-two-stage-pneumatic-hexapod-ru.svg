<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" lang="ru" role="img" aria-labelledby="title desc" font-family="Noto Sans, Arial, sans-serif" height="485" viewBox="0 0 360 485">
  <title id="title">Как воздух двигает ноги</title>
  <desc id="desc">Мягкий шестиногий робот · UC San Diego / Подача по шлангу — Воздух приходит извне / Малые камеры — Воздух под высоким давлением — двигает клапаны / Большие камеры — Тот же воздух при меньшем — давлении двигает ноги / Скорость на испытании — до 4,72 м/с.</desc>
  <rect id="paper" x="0" y="0" width="360" height="485" fill="#F7F4ED" data-role="background"/>
  <rect id="rule" x="20" y="16" width="52" height="4" fill="#0D615D"/>
  <text id="head0" x="20" y="47" font-size="23" fill="#18283A" font-weight="700">Как воздух двигает ноги</text>
  <text id="subtitle" x="20" y="77" font-size="15" fill="#425468" font-weight="400">Мягкий шестиногий робот · UC San Diego</text>
  <rect id="panel0" x="20" y="106" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k0" x="32" y="132" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel0">01</text>
  <text id="label0" x="64" y="132" font-size="17" fill="#18283A" font-weight="700" data-panel="panel0">Подача по шлангу</text>
  <text id="row0-0" x="32" y="160" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Воздух приходит извне</text>
  <path id="arrow0" d="M179 185 H181 V193 H185 L180 200 L175 193 H179 Z" fill="#0D615D"/>
  <rect id="panel1" x="20" y="205" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k1" x="32" y="231" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel1">02</text>
  <text id="label1" x="64" y="231" font-size="17" fill="#18283A" font-weight="700" data-panel="panel1">Малые камеры</text>
  <text id="row1-0" x="32" y="259" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">Воздух под высоким давлением</text>
  <text id="row1-1" x="32" y="282" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">двигает клапаны</text>
  <path id="arrow1" d="M179 307 H181 V315 H185 L180 322 L175 315 H179 Z" fill="#0D615D"/>
  <rect id="panel2" x="20" y="327" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k2" x="32" y="353" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel2">03</text>
  <text id="label2" x="64" y="353" font-size="17" fill="#18283A" font-weight="700" data-panel="panel2">Большие камеры</text>
  <text id="row2-0" x="32" y="381" font-size="16" fill="#18283A" font-weight="400" data-panel="panel2">Тот же воздух при меньшем</text>
  <text id="row2-1" x="32" y="404" font-size="16" fill="#18283A" font-weight="400" data-panel="panel2">давлении двигает ноги</text>
  <text id="note0" x="20" y="463" font-size="15" fill="#425468" font-weight="400">Скорость на испытании — до 4,72 м/с.</text>
