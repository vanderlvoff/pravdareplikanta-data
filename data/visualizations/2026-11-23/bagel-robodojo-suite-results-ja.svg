<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" lang="ja" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif" height="462" viewBox="0 0 360 462">
  <title id="title">両腕を動かす計画の立て方</title>
  <desc id="desc">Bagel-Robotics-1 · 仮想環境での試験 / 作業の指示と観測を取り込む — 3台のカメラの映像とロボットの状態、 — 作業を指示する文章を受け取る / 32ステップ分の動作を予測 — モデルが両腕の動作を計算する / 最初の16ステップを実行 — 動いた後のようすを観測し直す / 次の計画は、新しい観測情報をもとに立てる。</desc>
  <rect id="paper" x="0" y="0" width="360" height="462" fill="#F7F4ED" data-role="background"/>
  <rect id="rule" x="20" y="16" width="52" height="4" fill="#0D615D"/>
  <text id="head0" x="20" y="47" font-size="23" fill="#18283A" font-weight="700">両腕を動かす計画の立て方</text>
  <text id="subtitle" x="20" y="77" font-size="15" fill="#425468" font-weight="400">Bagel-Robotics-1 · 仮想環境での試験</text>
  <rect id="panel0" x="20" y="106" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k0" x="32" y="132" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel0">01</text>
  <text id="label0" x="64" y="132" font-size="17" fill="#18283A" font-weight="700" data-panel="panel0">作業の指示と観測を取り込む</text>
  <text id="row0-0" x="32" y="160" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">3台のカメラの映像とロボットの状態、</text>
  <text id="row0-1" x="32" y="183" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">作業を指示する文章を受け取る</text>
  <path id="arrow0" d="M179 208 H181 V216 H185 L180 223 L175 216 H179 Z" fill="#0D615D"/>
  <rect id="panel1" x="20" y="228" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k1" x="32" y="254" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel1">02</text>
  <text id="label1" x="64" y="254" font-size="17" fill="#18283A" font-weight="700" data-panel="panel1">32ステップ分の動作を予測</text>
  <text id="row1-0" x="32" y="282" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">モデルが両腕の動作を計算する</text>
  <path id="arrow1" d="M179 307 H181 V315 H185 L180 322 L175 315 H179 Z" fill="#0D615D"/>
  <rect id="panel2" x="20" y="327" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k2" x="32" y="353" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel2">03</text>
  <text id="label2" x="64" y="353" font-size="17" fill="#18283A" font-weight="700" data-panel="panel2">最初の16ステップを実行</text>
  <text id="row2-0" x="32" y="381" font-size="16" fill="#18283A" font-weight="400" data-panel="panel2">動いた後のようすを観測し直す</text>
  <text id="note0" x="20" y="440" font-size="15" fill="#425468" font-weight="400">次の計画は、新しい観測情報をもとに立てる。</text>
</svg>
