  <text id="head0" x="20" y="47" font-size="23" fill="#18283A" font-weight="700">Three sites under</text>
  <text id="head1" x="20" y="76" font-size="23" fill="#18283A" font-weight="700">consideration</text>
  <text id="subtitle" x="20" y="106" font-size="15" fill="#425468" font-weight="400">Space Data and Kasumigaseki Capital</text>
