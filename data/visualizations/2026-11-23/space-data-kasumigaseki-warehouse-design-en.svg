  <title id="title">Three sites under consideration</title>
  <desc id="desc">Space Data and Kasumigaseki Capital / Atsugi · spring 2029 — Planned warehouse for goods — kept at ambient temperature / Fukuroi · spring 2030 — Planned warehouse for frozen goods / Sakado · existing facility — Site for studying how equipment — and software work together / The dates refer to planned construction completion.</desc>
