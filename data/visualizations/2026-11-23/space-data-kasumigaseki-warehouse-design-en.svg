  <text id="row0-0" x="32" y="188" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Planned warehouse for goods</text>
  <text id="row0-1" x="32" y="211" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">kept at ambient temperature</text>
  <rect id="panel1" x="20" y="245" width="320" height="75" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
