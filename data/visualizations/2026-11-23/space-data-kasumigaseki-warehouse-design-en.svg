  <text id="row1-0" x="32" y="299" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">Planned warehouse for frozen goods</text>
  <rect id="panel2" x="20" y="333" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
