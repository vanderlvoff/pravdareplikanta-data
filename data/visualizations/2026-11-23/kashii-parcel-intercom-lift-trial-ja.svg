  <title id="title">配達ロボットはどう上の階へ？</title>
  <desc id="desc">福岡市香椎（かしい）の配送試験 / 部屋の玄関 — 住人に手渡すか、 — 玄関前に箱を置く / エレベーターの中 — 箱を積んだロボットが — 届け先の階へ上がる / 建物の入口 — 配達員が箱を — ロボットにわたす / 矢印は荷物が通る道。</desc>
