  <text id="row2-0" x="32" y="336" font-size="16" fill="#18283A" font-weight="400" data-panel="panel2">設備と運用システムの連携を検討</text>
  <text id="note0" x="20" y="395" font-size="15" fill="#425468" font-weight="400">厚木と袋井の日付は建物の完成予定。</text>
