<svg xmlns="http://www.w3.org/2000/svg" width="360" lang="ru" role="img" aria-labelledby="title desc" font-family="Noto Sans, Arial, sans-serif" height="508" viewBox="0 0 360 508">
  <title id="title">Три складские площадки</title>
  <desc id="desc">Space Data и Kasumigaseki Capital / Ацуги · весна 2029 — Планируемый склад для грузов — при обычной температуре / Фукурои · весна 2030 — Планируемый склад для — замороженных грузов / Сакадо · действующий склад — Площадка для изучения связи — оборудования и систем / Сроки относятся к завершению строительства.</desc>
  <rect id="paper" x="0" y="0" width="360" height="508" fill="#F7F4ED" data-role="background"/>
