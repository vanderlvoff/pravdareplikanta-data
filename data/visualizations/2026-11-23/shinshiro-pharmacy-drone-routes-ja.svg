<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="413" viewBox="0 0 360 413" role="img" lang="ja" aria-labelledby="title desc" font-family="Noto Sans CJK JP, sans-serif">
  <title id="title">薬を運ぶ二つのルート</title>
  <desc id="desc">愛知県新城市での試験 / 出発場所 — 箱を積む所 / 途中の薬局 — 箱を積む所 / 薬局 — 車で箱を運ぶ / 発着場所 — 箱を機体に積む / 発着場所 — 荷物なしで出発 / 薬局 — 職員が箱を積む / 高齢者施設 — 箱を受け取る / 線は立ち寄る順番を示す。</desc>
  <rect id="rect1" data-zone="background" x="0" y="0" width="360" height="413" fill="#F8F5ED" rx="0"/>
  <text id="text2" data-zone="text" x="20" y="32" fill="#15655E" font-size="14" font-weight="700" text-anchor="start">愛知県新城市での試験</text>
  <text id="text3" data-zone="text" x="20" y="67" fill="#16293B" font-size="22" font-weight="700" text-anchor="start">薬を運ぶ二つのルート</text>
  <text id="text4" data-zone="text" x="44" y="112" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">箱を積む所</text>
  <text id="text5" data-zone="text" x="44" y="136" fill="#15655E" font-size="17" font-weight="700" text-anchor="start">出発場所</text>
  <text id="text6" data-zone="text" x="205" y="112" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">箱を積む所</text>
  <text id="text7" data-zone="text" x="205" y="136" fill="#9E4A30" font-size="17" font-weight="700" text-anchor="start">途中の薬局</text>
