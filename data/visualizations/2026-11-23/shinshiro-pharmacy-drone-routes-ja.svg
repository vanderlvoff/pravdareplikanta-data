  <circle id="circle9" data-zone="art" cx="25" cy="173" r="6" fill="#F8F5ED" stroke="#15655E" stroke-width="2.5"/>
  <circle id="circle10" data-zone="art" cx="25" cy="248" r="6" fill="#F8F5ED" stroke="#15655E" stroke-width="2.5"/>
  <circle id="circle11" data-zone="art" cx="25" cy="328" r="6" fill="#F8F5ED" stroke="#15655E" stroke-width="2.5"/>
  <path id="path12" data-zone="art" d="M186 155 V330" fill="none" stroke="#9E4A30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="circle13" data-zone="art" cx="186" cy="173" r="6" fill="#F8F5ED" stroke="#9E4A30" stroke-width="2.5"/>
  <circle id="circle14" data-zone="art" cx="186" cy="248" r="6" fill="#F8F5ED" stroke="#9E4A30" stroke-width="2.5"/>
  <circle id="circle15" data-zone="art" cx="186" cy="328" r="6" fill="#F8F5ED" stroke="#9E4A30" stroke-width="2.5"/>
  <text id="text16" data-zone="text" x="44" y="178" fill="#16293B" font-size="16" font-weight="700" text-anchor="start">薬局</text>
  <text id="text17" data-zone="text" x="44" y="199" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">車で箱を運ぶ</text>
  <text id="text18" data-zone="text" x="44" y="253" fill="#16293B" font-size="16" font-weight="700" text-anchor="start">発着場所</text>
  <text id="text19" data-zone="text" x="44" y="274" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">箱を機体に積む</text>
  <text id="text20" data-zone="text" x="205" y="178" fill="#16293B" font-size="16" font-weight="700" text-anchor="start">発着場所</text>
  <text id="text21" data-zone="text" x="205" y="199" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">荷物なしで出発</text>
  <text id="text22" data-zone="text" x="205" y="253" fill="#16293B" font-size="16" font-weight="700" text-anchor="start">薬局</text>
  <text id="text23" data-zone="text" x="205" y="274" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">職員が箱を積む</text>
  <text id="text24" data-zone="text" x="38" y="334" fill="#16293B" font-size="15" font-weight="700" text-anchor="start">高齢者施設</text>
  <text id="text25" data-zone="text" x="38" y="356" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">箱を受け取る</text>
  <text id="text26" data-zone="text" x="204" y="334" fill="#16293B" font-size="15" font-weight="700" text-anchor="start">高齢者施設</text>
  <text id="text27" data-zone="text" x="204" y="356" fill="#4B5B66" font-size="14" font-weight="400" text-anchor="start">箱を受け取る</text>
