<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" lang="en" role="img" aria-labelledby="title desc" font-family="Noto Sans, Arial, sans-serif" height="448" viewBox="0 0 360 448">
  <title id="title">Where the drone collects medicine</title>
  <desc id="desc">Two trial routes · Shinshiro / Load at the launch site — Pharmacy staff bring a box by road — The drone flies to a nursing home / Load at a pharmacy stop — The drone leaves empty and lands — near a pharmacy for staff to load it — It then flies to a nursing home / At both destinations, people collect the box.</desc>
  <rect id="paper" x="0" y="0" width="360" height="448" fill="#F7F4ED" data-role="background"/>
  <rect id="rule" x="20" y="16" width="52" height="4" fill="#0D615D"/>
  <text id="head0" x="20" y="47" font-size="23" fill="#18283A" font-weight="700">Where the drone collects</text>
  <text id="head1" x="20" y="76" font-size="23" fill="#18283A" font-weight="700">medicine</text>
  <text id="subtitle" x="20" y="106" font-size="15" fill="#425468" font-weight="400">Two trial routes · Shinshiro</text>
  <rect id="panel0" x="20" y="134" width="320" height="98" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k0" x="32" y="160" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel0">01</text>
  <text id="label0" x="64" y="160" font-size="17" fill="#18283A" font-weight="700" data-panel="panel0">Load at the launch site</text>
  <text id="row0-0" x="32" y="188" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">Pharmacy staff bring a box by road</text>
  <text id="row0-1" x="32" y="211" font-size="16" fill="#18283A" font-weight="400" data-panel="panel0">The drone flies to a nursing home</text>
  <rect id="panel1" x="20" y="245" width="320" height="121" fill="#FFFDF9" stroke="#BFC8CB" stroke-width="1" data-role="panel"/>
  <text id="k1" x="32" y="271" font-size="15" fill="#0D615D" font-weight="700" data-panel="panel1">02</text>
  <text id="label1" x="64" y="271" font-size="17" fill="#18283A" font-weight="700" data-panel="panel1">Load at a pharmacy stop</text>
  <text id="row1-0" x="32" y="299" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">The drone leaves empty and lands</text>
  <text id="row1-1" x="32" y="322" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">near a pharmacy for staff to load it</text>
  <text id="row1-2" x="32" y="345" font-size="16" fill="#18283A" font-weight="400" data-panel="panel1">It then flies to a nursing home</text>
  <text id="note0" x="20" y="404" font-size="15" fill="#425468" font-weight="400">At both destinations, people collect the</text>
  <text id="note1" x="20" y="426" font-size="15" fill="#425468" font-weight="400">box.</text>
</svg>
