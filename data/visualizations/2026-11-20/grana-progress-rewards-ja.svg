<svg xmlns="http://www.w3.org/2000/svg" lang="ja" role="img" aria-label="Granaは作業の進み具合をどう測るか" width="100%" viewBox="0 0 380 345" font-family="Noto Sans CJK JP, sans-serif" fill="#182c30"><title>Granaは作業の進み具合をどう測るか</title><text id="t8" x="20" y="33" font-size="20" font-weight="700">Granaは作業の進み具合をどう測るか</text><g><rect id="b0" x="8" y="55" width="364" height="133" fill="#e8f1ef"/><text id="t1" x="20" y="86" font-size="21" font-weight="700">取り組む作業を選ぶ</text><text id="t2" x="20" y="118" font-size="18" font-weight="400">画像と言葉をもとに、まだ終わって</text><text id="t3" x="20" y="143" font-size="18" font-weight="400">いない作業を選ぶ。</text></g><g><rect id="b1" x="8" y="201" width="364" height="133" fill="#f1eee6"/><text id="t4" x="20" y="232" font-size="21" font-weight="700">全体の進み具合を求める</text><text id="t5" x="20" y="264" font-size="18" font-weight="400">選んだ作業がどこまで進んだかを</text><text id="t6" x="20" y="289" font-size="18" font-weight="400">見積もり、すでに終えた作業の分を</text><text id="t7" x="20" y="314" font-size="18" font-weight="400">加える。</text></g></svg>
