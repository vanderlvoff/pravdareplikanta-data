<svg xmlns="http://www.w3.org/2000/svg" lang="ja" role="img" aria-label="MITの小さなロボットが飛ぶしくみ" width="100%" viewBox="0 0 380 345" font-family="Noto Sans CJK JP, sans-serif" fill="#182c30"><title>MITの小さなロボットが飛ぶしくみ</title><text id="t8" x="20" y="33" font-size="20" font-weight="700">MITの小さなロボットが飛ぶしくみ</text><g><rect id="b0" x="8" y="55" width="364" height="133" fill="#e8f1ef"/><text id="t1" x="20" y="86" font-size="21" font-weight="700">機体の中</text><text id="t2" x="20" y="118" font-size="18" font-weight="400">センサーと計算装置を積み、外から</text><text id="t3" x="20" y="143" font-size="18" font-weight="400">カメラで位置を追わずに飛べる。</text></g><g><rect id="b1" x="8" y="201" width="364" height="133" fill="#f1eee6"/><text id="t4" x="20" y="232" font-size="21" font-weight="700">機体の外</text><text id="t5" x="20" y="264" font-size="18" font-weight="400">電子回路と、羽を動かす装置に</text><text id="t6" x="20" y="289" font-size="18" font-weight="400">必要な電力は、機体の外にある</text><text id="t7" x="20" y="314" font-size="18" font-weight="400">電源から供給する。</text></g></svg>
