<svg xmlns="http://www.w3.org/2000/svg" lang="ru" role="img" aria-label="Как летает микроробот MIT" width="100%" viewBox="0 0 380 345" font-family="DejaVu Sans, sans-serif" fill="#182c30"><title>Как летает микроробот MIT</title><text id="t9" x="20" y="33" font-size="20" font-weight="700">Как летает микроробот MIT</text><g><rect id="b0" x="8" y="55" width="364" height="133" fill="#e8f1ef"/><text id="t1" x="20" y="86" font-size="21" font-weight="700">На борту</text><text id="t2" x="20" y="118" font-size="18" font-weight="400">Датчики и вычислитель помогают</text><text id="t3" x="20" y="143" font-size="18" font-weight="400">управлять полётом без внешних</text><text id="t4" x="20" y="168" font-size="18" font-weight="400">камер слежения.</text></g><g><rect id="b1" x="8" y="201" width="364" height="133" fill="#f1eee6"/><text id="t5" x="20" y="232" font-size="21" font-weight="700">Вне робота</text><text id="t6" x="20" y="264" font-size="18" font-weight="400">Питание для электроники</text><text id="t7" x="20" y="289" font-size="18" font-weight="400">и приводов крыльев поступает</text><text id="t8" x="20" y="314" font-size="18" font-weight="400">от внешнего источника.</text></g></svg>
