<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="ru" role="img" aria-labelledby="heading desc" font-family="'Noto Sans', sans-serif" id="obj-0"><title id="heading">Три стенда Chitose Robotics</title><desc id="desc">Запланировано для RoboNext в Осаке. FANUC. Захват деталей из кучи. Камера → контур → присоска. Universal Robots. Повтор движения. Ручное управление → запись → повтор. Elite Robots. Прокладка кабеля. Заданные точки → плавная траектория.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">Три стенда Chitose Robotics</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">Запланировано для RoboNext в Осаке</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">FANUC</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">Захват деталей из кучи</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">Камера → контур → присоска</text></g><g data-role="card" id="obj-12"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-13" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-14">Universal Robots</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-15">Повтор движения</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-16">Ручное управление → запись → повтор</text></g><g data-role="card" id="obj-17"><rect x="18" y="329" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-18" /><text x="31" y="352" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-19">Elite Robots</text><text x="31" y="378" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-20">Прокладка кабеля</text><text x="31" y="402" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-21">Заданные точки → плавная траектория</text></g></svg>
