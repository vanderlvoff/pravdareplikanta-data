<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="ru" role="img" aria-labelledby="heading desc" font-family="'Noto Sans', sans-serif" id="obj-0"><title id="heading">Как BrightAI наблюдает за техникой</title><desc id="desc">По описанию Smith Point Capital. Датчики. Записывают сигналы. Звук, температура и вибрация. Компьютер на объекте. Ищет изменения. Обрабатывает данные рядом с машиной. При необходимости. Осмотр с роботом или дроном. Дополнительные сведения об участке.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">Как BrightAI наблюдает за техникой</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">По описанию Smith Point Capital</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">Датчики</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">Записывают сигналы</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">Звук, температура и вибрация</text></g><path d="M 180 199 v 12 m -4 -4 l 4 4 4 -4" stroke="#39594e" stroke-width="1.5" fill="none" data-role="arrow" id="obj-12" /><g data-role="card" id="obj-13"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-14" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-15">Компьютер на объекте</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-16">Ищет изменения</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-17">Обрабатывает данные рядом с машиной</text></g><path d="M 180 312 v 12 m -4 -4 l 4 4 4 -4" stroke="#39594e" stroke-width="1.5" fill="none" data-role="arrow" id="obj-18" /><g data-role="card" id="obj-19"><rect x="18" y="329" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-20" /><text x="31" y="352" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-21">При необходимости</text><text x="31" y="378" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-22">Осмотр с роботом или дроном</text><text x="31" y="402" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-23">Дополнительные сведения об участке</text></g></svg>
