<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="ja" role="img" aria-labelledby="heading desc" font-family="'Noto Sans CJK JP', 'Noto Sans', sans-serif" id="obj-0"><title id="heading">BrightAIの設備監視の仕組み</title><desc id="desc">出資者Smith Point Capitalの説明. センサー. 設備の状態を記録する. 音・温度・振動を測る. 現場のコンピューター. いつもと違う変化を探す. 機械の近くでデータを処理. 必要に応じて. ロボットやドローンで点検する. 気になる場所を詳しく確認.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">BrightAIの設備監視の仕組み</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">出資者Smith Point Capitalの説明</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">センサー</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">設備の状態を記録する</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">音・温度・振動を測る</text></g><path d="M 180 199 v 12 m -4 -4 l 4 4 4 -4" stroke="#39594e" stroke-width="1.5" fill="none" data-role="arrow" id="obj-12" /><g data-role="card" id="obj-13"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-14" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-15">現場のコンピューター</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-16">いつもと違う変化を探す</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-17">機械の近くでデータを処理</text></g><path d="M 180 312 v 12 m -4 -4 l 4 4 4 