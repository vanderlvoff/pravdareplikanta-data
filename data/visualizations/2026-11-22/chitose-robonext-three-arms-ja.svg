<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="ja" role="img" aria-labelledby="heading desc" font-family="'Noto Sans CJK JP', 'Noto Sans', sans-serif" id="obj-0"><title id="heading">チトセロボティクスの三つの実演</title><desc id="desc">大阪のRoboNextで実演予定. FANUC. 山積みの部品を取り出す. カメラ → 輪郭 → 吸盤. Universal Robots. 人が示した動きを再現する. 手元で操作 → 記録 → 再生. Elite Robots. 柔らかいケーブルを通す. 指定した地点 → 滑らかな軌道.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">チトセロボティクスの三つの実演</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">大阪のRoboNextで実演予定</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">FANUC</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">山積みの部品を取り出す</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">カメラ → 輪郭 → 吸盤</text></g><g data-role="card" id="obj-12"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-13" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-14">Universal Robots</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-15">人が示した動きを再現する</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-16">手元で操作 → 記録 → 再生</text></g><g data-role="card" id="obj-17"><rect x="18" y="329" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-18" /><text x="31" y="352" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-19">Elite Robots</text><text x="31" y="378" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-20">柔らかいケーブルを通す</text><text x="31" y="402" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-21">指定した地点 → 滑らかな軌道</text></g></svg>
