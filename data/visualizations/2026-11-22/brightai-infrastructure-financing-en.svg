<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="en" role="img" aria-labelledby="heading desc" font-family="'Noto Sans', sans-serif" id="obj-0"><title id="heading">How BrightAI monitors equipment</title><desc id="desc">As described by Smith Point Capital. Sensors. Record signals. Sound, temperature and vibration. On-site computer. Looks for changes. Processes data near the machine. When needed. Robot or drone inspection. A closer look at the site.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">How BrightAI monitors equipment</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">As described by Smith Point Capital</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">Sensors</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">Record signals</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">Sound, temperature and vibration</text></g><path d="M 180 199 v 12 m -4 -4 l 4 4 4 -4" stroke="#39594e" stroke-width="1.5" fill="none" data-role="arrow" id="obj-12" /><g data-role="card" id="obj-13"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-14" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-15">On-site computer</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-16">Looks for changes</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-17">Processes data near the machine</text></g><path d="M 180 312 v 12 m -4 -4 l 4 4 4 -4" stroke="#39594e" stroke-width="1.5" fill="none" data-role="arrow" id="obj-18" /><g data-role="card" id="obj-19"><rect x="18" y="329" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-20" /><text x="31" y="352" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-21">When needed</text><text x="31" y="378" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-22">Robot or drone inspection</text><text x="31" y="402" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-23">A closer look at the site</text></g></svg>
