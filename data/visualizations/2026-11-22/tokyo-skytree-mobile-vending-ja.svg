<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" lang="ja" role="img" aria-labelledby="heading desc" font-family="'Noto Sans CJK JP', 'Noto Sans', sans-serif" id="obj-0"><title id="heading">東京スカイツリーの移動販売</title><desc id="desc">試験で調べる三つの項目. カメラ. 足を止めた人の割合. 売り場の近くを通った人のうち. 販売記録. ぬいぐるみの売れ行き. 商品の販売実績を調べる. アンケート. 来場者の満足度. 買い物の感想を聞く.</desc><rect width="360" height="448" fill="#faf6ed" data-role="background" id="obj-3" /><rect x="18" y="18" width="324" height="3" fill="#39594e" data-role="rule" id="obj-4" /><text x="19" y="53" font-size="17" font-weight="700" fill="#182b23" data-kind="heading" id="obj-5">東京スカイツリーの移動販売</text><text x="19" y="78" font-size="14" font-weight="400" fill="#37554a" data-kind="subtitle" id="obj-6">試験で調べる三つの項目</text><g data-role="card" id="obj-7"><rect x="18" y="103" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-8" /><text x="31" y="126" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-9">カメラ</text><text x="31" y="152" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-10">足を止めた人の割合</text><text x="31" y="176" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-11">売り場の近くを通った人のうち</text></g><g data-role="card" id="obj-12"><rect x="18" y="216" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-13" /><text x="31" y="239" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-14">販売記録</text><text x="31" y="265" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-15">ぬいぐるみの売れ行き</text><text x="31" y="289" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-16">商品の販売実績を調べる</text></g><g data-role="card" id="obj-17"><rect x="18" y="329" width="324" height="94" rx="5" fill="#fffdf6" stroke="#c6cfc1" data-role="panel" id="obj-18" /><text x="31" y="352" font-size="14" font-weight="600" fill="#37574b" data-kind="category" id="obj-19">アンケート</text><text x="31" y="378" font-size="17" font-weight="700" fill="#162a21" data-kind="label" id="obj-20">来場者の満足度</text><text x="31" y="402" font-size="14" font-weight="400" fill="#30453c" data-kind="detail" id="obj-21">買い物の感想を聞く</text></g></svg>
