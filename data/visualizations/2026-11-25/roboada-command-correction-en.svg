<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 633" width="360" height="633" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Does correction help robots succeed?</title>
  <desc id="desc">Tasks completed successfully (%) Uncorrected With RoboAda LIBERO 11 changes in physical conditions 5 policies, 4,400 paired runs each RoboTwin 2.0 Offsets in target joint angles Fast-WAM, 800 paired runs Both results come from simulation.</desc>
