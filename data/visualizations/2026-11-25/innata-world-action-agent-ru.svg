<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 615" width="360" height="615" xml:lang="ru" role="img" aria-labelledby="title desc">
  <title id="title">Как робот исправляет положение сковороды</title>
  <desc id="desc">Проверка результата После повторного захвата Агент замечает, что сковорода стоит на другой конфорке. Робот переносит сковороду на нужную конфорку. Схема эпизода из статьи, рис. 15.</desc>
  <rect x="0" y="0" width="360" height="615" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">Эпизод в симуляторе RoboCasa365</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">Как робот исправляет</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">положение сковороды</text>
