<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 615" width="360" height="615" xml:lang="ja" role="img" aria-labelledby="title desc">
  <title id="title">フライパンを 指定の場所へ置き直す</title>
  <desc id="desc">置いた場所を確認 つかみ直したあと 確認役が、フライパンが別の コンロにあると気づく。 ロボットがフライパンを 指定されたコンロに移す。 論文の図15をもとにした模式図。</desc>
  <rect x="0" y="0" width="360" height="615" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">RoboCasa365でのシミュレーション</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">フライパンを</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">指定の場所へ置き直す</text>
  <circle cx="33" cy="137" r="8" fill="none" stroke="#116768" data-qa-group="legend" id="g6"/>
  <text x="50" y="142" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g7">指定されたコンロ</text>
  <text x="29" y="183" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g8">置いた場所を確認</text>
  <rect x="29" y="199" width="302" height="87" rx="7" fill="#edf0ec" stroke="#a3b4ae" stroke-width="1" data-qa-group="cooktop-False" id="g9"/>
  <circle cx="100" cy="242" r="29" fill="#fffefa" stroke="#9caaaa" data-qa-group="cooktop-False" id="g10"/>
  <circle cx="100" cy="242" r="21" fill="none" stroke="#9caaaa" data-qa-group="cooktop-False" id="g11"/>
  <circle cx="100" cy="242" r="13" fill="none" stroke="#9caaaa" data-qa-group="cooktop-False" id="g12"/>
  <circle cx="250" cy="242" r="29" fill="#fffefa" stroke="#9caaaa" data-qa-group="cooktop-False" id="g13"/>
  <circle cx="250" cy="242" r="21" fill="none" stroke="#9caaaa" data-qa-group="cooktop-False" id="g14"/>
  <circle cx="250" cy="242" r="13" fill="none" stroke="#9caaaa" data-qa-group="cooktop-False" id="g15"/>
  <circle cx="100" cy="242" r="24" fill="#f4d4ba" stroke="#9a4627" data-qa-group="cooktop-False" id="g16"/>
  <circle cx="100" cy="242" r="18" fill="#f9e8d7" stroke="#9a4627" data-qa-group="cooktop-False" id="g17"/>
  <rect x="122" y="238" width="35" height="8" rx="4" fill="#9a4627" stroke="none" stroke-width="1" data-qa-group="cooktop-False" id="g18"/>
  <circle cx="250" cy="242" r="33" fill="none" stroke="#116768" data-qa-group="cooktop-False" id="g19"/>
  <text x="29" y="309" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g20">確認役が、フライパンが別の</text>
  <text x="29" y="330" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g21">コンロにあると気づく。</text>
  <text x="29" y="367" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g22">つかみ直したあと</text>
  <rect x="29" y="383" width="302" height="87" rx="7" fill="#edf0ec" stroke="#a3b4ae" stroke-width="1" data-qa-group="cooktop-True" id="g23"/>
  <circle cx="100" cy="426" r="29" fill="#fffefa" stroke="#9caaaa" data-qa-group="cooktop-True" id="g24"/>
  <circle cx="100" cy="426" r="21" fill="none" stroke="#9caaaa" data-qa-group="cooktop-True" id="g25"/>
  <circle cx="100" cy="426" r="13" fill="none" stroke="#9caaaa" data-qa-group="cooktop-True" id="g26"/>
  <circle cx="250" cy="426" r="29" fill="#fffefa" stroke="#9caaaa" data-qa-group="cooktop-True" id="g27"/>
  <circle cx="250" cy="426" r="21" fill="none" stroke="#9caaaa" data-qa-group="cooktop-True" id="g28"/>
  <circle cx="250" cy="426" r="13" fill="none" stroke="#9caaaa" data-qa-group="cooktop-True" id="g29"/>
  <circle cx="250" cy="426" r="24" fill="#f4d4ba" stroke="#9a4627" data-qa-group="cooktop-True" id="g30"/>
  <circle cx="250" cy="426" r="18" fill="#f9e8d7" stroke="#9a4627" data-qa-group="cooktop-True" id="g31"/>
  <rect x="272" y="422" width="35" height="8" rx="4" fill="#9a4627" stroke="none" stroke-width="1" data-qa-group="cooktop-True" id="g32"/>
  <circle cx="250" cy="426" r="33" fill="none" stroke="#116768" data-qa-group="cooktop-True" id="g33"/>
  <text x="29" y="493" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g34">ロボットがフライパンを</text>
  <text x="29" y="514" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g35">指定されたコンロに移す。</text>
  <text x="24" y="550" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g36">論文の図15をもとにした模式図。</text>
  <text x="24" y="591" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g37">出典：北京智源人工知能研究院ほか</text>
</svg>
