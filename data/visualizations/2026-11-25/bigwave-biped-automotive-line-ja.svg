<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 551" width="360" height="551" xml:lang="ja" role="img" aria-labelledby="title desc">
  <title id="title">一台のロボットが 二つの作業場所へ</title>
  <desc id="desc">自動車部品工場での試験。 部品を入れる 取り出し口まで歩く 台車に積む 部品の曲がりを直す 機械に入れる。 機械の処理が終わると、 約10メートル歩く。 取り出し口で部品を 受け取り、台車に積む。 機械とロボットは、作業の 進み具合を信号で伝え合う。 試験の流れを示す模式図。</desc>
  <rect x="0" y="0" width="360" height="551" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">Bigwave Robotics</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">一台のロボットが</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">二つの作業場所へ</text>
  <text x="24" y="139" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" text-anchor="start" id="g6">自動車部品工場での試験。</text>
  <text x="45" y="195" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g7">部品を入れる</text>
  <text x="45" y="220" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g8">部品の曲がりを直す</text>
  <text x="45" y="241" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g9">機械に入れる。</text>
