  <rect x="245" y="399" width="16" height="18" rx="3" fill="#cde6e0" stroke="#116768" stroke-width="1" data-qa-group="illustration-2" id="g40"/>
  <path d="M249 417 v15 h-5 M257 417 v15 h5 M245 404 l-5 12 M261 404 l6 4 9 -1" fill="none" stroke="#116768" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" data-qa-group="illustration-2" id="g41"/>
  <path d="M278 419 H325 L328 403" fill="none" stroke="#116768" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" data-qa-group="illustration-2" id="g42"/>
  <rect x="283" y="413" width="26" height="5" rx="1" fill="#f4d4ba" stroke="#9a4627" stroke-width="1" data-qa-group="illustration-2" id="g43"/>
  <rect x="287" y="406" width="26" height="5" rx="1" fill="#f4d4ba" stroke="#9a4627" stroke-width="1" data-qa-group="illustration-2" id="g44"/>
  <rect x="291" y="399" width="26" height="5" rx="1" fill="#f4d4ba" stroke="#9a4627" stroke-width="1" data-qa-group="illustration-2" id="g45"/>
  <circle cx="289" cy="428" r="4" fill="#fffefa" stroke="#116768" data-qa-group="illustration-2" id="g46"/>
  <circle cx="318" cy="428" r="4" fill="#fffefa" stroke="#116768" data-qa-group="illustration-2" id="g47"/>
  <text x="24" y="460" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700" text-anchor="start" id="g48">機械とロボットは、作業の</text>
  <text x="24" y="481" fill="#116768" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="700" text-anchor="start" id="g49">進み具合を信号で伝え合う。</text>
  <text x="24" y="507" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g50">試験の流れを示す模式図。</text>
  <text x="24" y="532" fill="#40575b" font-family="Noto Sans CJK JP, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g51">出典：Bigwave Robotics</text>
