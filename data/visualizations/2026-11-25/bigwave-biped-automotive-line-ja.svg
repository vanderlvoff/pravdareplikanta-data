  <rect x="282" y="203" width="46" height="42" rx="3" fill="#cde6e0" stroke="#116768" stroke-width="1" data-qa-group="illustration-0" id="g16"/>
  <rect x="283" y="217" width="26" height="14" rx="0" fill="#fffefa" stroke="#116768" stroke-width="1" data-qa-group="illustration-0" id="g17"/>
  <rect x="277" y="221" width="17" height="6" rx="1" fill="#f4d4ba" stroke="#9a4627" stroke-width="1" data-qa-group="illustration-0" id="g18"/>
  <line x1="306" y1="209" x2="320" y2="209" stroke="#116768" stroke-width="1" data-qa-group="illustration-0" id="g19"/>
  <text x="45" y="289" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g20">取り出し口まで歩く</text>
  <text x="45" y="314" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g21">機械の処理が終わると、</text>
  <text x="45" y="335" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g22">約10メートル歩く。</text>
