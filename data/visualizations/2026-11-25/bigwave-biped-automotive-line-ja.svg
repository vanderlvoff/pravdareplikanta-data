  <line x1="273" y1="346" x2="281" y2="346" stroke="#116768" stroke-width="1.4" data-qa-group="illustration-1" id="g31"/>
  <line x1="291" y1="346" x2="299" y2="346" stroke="#116768" stroke-width="1.4" data-qa-group="illustration-1" id="g32"/>
  <line x1="309" y1="346" x2="317" y2="346" stroke="#116768" stroke-width="1.4" data-qa-group="illustration-1" id="g33"/>
  <text x="45" y="383" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g34">台車に積む</text>
  <text x="45" y="408" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g35">取り出し口で部品を</text>
  <text x="45" y="429" fill="#182d33" font-family="Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g36">受け取り、台車に積む。</text>
