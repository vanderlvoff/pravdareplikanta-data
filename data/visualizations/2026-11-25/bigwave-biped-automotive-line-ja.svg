  <line x1="27" y1="196" x2="27" y2="278" stroke="#9caaaa" stroke-width="2" data-qa-group="step-0" id="g11"/>
  <line x1="233" y1="246" x2="330" y2="246" stroke="#9caaaa" stroke-width="1.2" data-qa-group="illustration-0" id="g12"/>
