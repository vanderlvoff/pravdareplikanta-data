<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 551" width="360" height="551" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Two stations, one robot</title>
  <desc id="desc">Trial at an automotive parts plant. Load the part Walk to the outfeed Stack the part The robot feeds a part into the straightener. Machining is complete. The robot walks ≈ 10 m. The robot picks up the part and stacks it on a cart. The machine and robot exchange signals about the work sequence. Illustration of the trial.</desc>
