<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">From circuit drawing to assembly plan</title>
  <desc id="desc">Circuit drawing 3D layout Robot assembly In development Illustrative example, not to scale.</desc>
  <rect x="0" y="0" width="360" height="540" rx="0" fill="#f6f7f2" stroke="none" stroke-width="1" data-qa-group="bg" id="g2"/>
  <text x="24" y="32" fill="#116768" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" id="g3">Vetaion</text>
  <text x="24" y="68" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g4">From circuit drawing</text>
  <text x="24" y="102" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" id="g5">to assembly plan</text>
  <text x="24" y="145" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g6">Circuit drawing</text>
  <text x="24" y="170" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g7">Shows which parts</text>
  <text x="24" y="191" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g8">to connect.</text>
  <line x1="24" y1="223" x2="336" y2="223" stroke="#9caaaa" stroke-width="1" data-qa-group="separator0" id="g9"/>
  <text x="24" y="249" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g10">3D layout</text>
  <text x="24" y="274" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g11">Shows where the</text>
  <text x="24" y="295" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g12">parts fit in a cabinet.</text>
  <line x1="24" y1="327" x2="336" y2="327" stroke="#9caaaa" stroke-width="1" data-qa-group="separator1" id="g13"/>
  <text x="24" y="353" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" id="g14">Robot assembly</text>
  <text x="24" y="378" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g15">Mounting parts</text>
  <text x="24" y="399" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g16">and connecting</text>
  <text x="24" y="420" fill="#182d33" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g17">the wires.</text>
  <text x="24" y="450" fill="#9a4627" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" id="g18">In development</text>
  <text x="24" y="488" fill="#40575b" font-family="Noto Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" id="g19">Illustrative example, not to scale.</text>
  <text x="24" y="516" fill="#40575b" font-family="Noto Sans, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" id="g20">Sources: UVC Partners, UnternehmerTUM</text>
