<text x="300" y="57" text-anchor="middle" font-size="14">Кандидатные</text>
<text x="300" y="80" text-anchor="middle" font-size="14">действия</text>
<rect x="15" y="185" width="170" height="80" rx="6" fill="white" stroke="#899289"/>
<text x="100" y="217" text-anchor="middle" font-size="14">Модель динамики</text>
<text x="100" y="240" text-anchor="middle" font-size="14">Условный прогноз</text>
<rect x="215" y="185" width="170" height="80" rx="6" fill="white" stroke="#899289"/>
