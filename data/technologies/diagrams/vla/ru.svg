<rect x="215" y="25" width="170" height="80" rx="6" fill="white" stroke="#899289"/>
<text x="300" y="57" text-anchor="middle" font-size="14">Зрение + язык</text>
<text x="300" y="80" text-anchor="middle" font-size="14">Общее представление</text>
<rect x="15" y="185" width="170" height="80" rx="6" fill="white" stroke="#899289"/>
<text x="100" y="217" text-anchor="middle" font-size="14">Генератор действий</text>
